name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate backend and frontend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rural_producers_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rural_producers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/rural_producers_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Run backend lint
        run: npm run lint:check

      - name: Run backend build
        run: npm run build

      - name: Run frontend build
        run: npm run frontend:build

      - name: Run backend unit tests
        run: npm run test

      - name: Run backend e2e tests
        run: npm run test:e2e

      - name: Audit backend dependencies
        run: npm audit --audit-level=moderate

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=moderate

  docker-build:
    name: Validate Docker image build
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: brain-ag-project:ci
